# Generated by `iso init --ci`. Deploys with GitHub OIDC; no AWS keys in GitHub.
name: iso
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  id-token: write
  contents: read
  pull-requests: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::__ACCOUNT__:role/iso-deploy
          aws-region: __REGION__
      - if: github.event_name == 'push'
        run: npx @isomorph.ai/iso up --env production --yes
      - if: github.event_name == 'pull_request' && github.event.action != 'closed'
        id: preview
        run: |
          npx @isomorph.ai/iso up --env pr-${{ github.event.number }} --yes --json > out.json
          echo "url=$(node -p "require('./out.json').url")" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `Preview: ${{ steps.preview.outputs.url }}` })
      - if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: npx @isomorph.ai/iso down --env pr-${{ github.event.number }} --yes
